name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Minecraft hiện đại thường dùng Java 17+
          distribution: 'temurin'

      # 1. Nếu là dự án Gradle (đa số Mod/Plugin hiện nay)
      - name: Build with Gradle
        if: hashFiles('**/build.gradle*', '**/build.gradle.kts') != ''
        run: |
          chmod +x ./gradlew
          ./gradlew build

      # 2. Nếu là dự án Maven (Plugin cũ hoặc truyền thống)
      - name: Build with Maven
        if: hashFiles('**/pom.xml') != ''
        run: mvn -B package --file pom.xml

      # 3. Tìm file .jar đã build xong (trong thư mục build/libs hoặc target)
      - name: Prepare Artifacts
        run: |
          mkdir -p artifacts
          find . -name "*.jar" -not -path "*/.*" -not -path "./artifacts/*" -exec cp {} ./artifacts/ \;
          cd artifacts
          # Đổi tên để dễ nhận diện nếu cần, hoặc để nguyên
          ls -R

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
